spring.application.name=pyme_facturacion

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pyme_facturacion
spring.datasource.username=pyme_user
spring.datasource.password=pyme_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# REST API Configuration
server.port=8080
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson configuration for JSON responses
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# Security configuration (temporarily disable for API development)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN
